<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
        }
        input{
            width: 300px;
            height: 30px;
            padding-left: 10px;
            margin-top: 10px;
        }
        td{
            text-align: center;
        }
        .radio-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
        }
        .radio-group input{
            width: auto;
            height: auto;
            margin: 0;
        }
        #submit{
            padding-left: 0px;
            width: 150px;
        }
    </style>
</head>
<body>
    <h2>Sign Up</h2>
    <form action="" method="post">
        <table>
            <tr>
                <td><input type="text" name="user_name" placeholder="Full Name"></td>
            </tr>
            <tr>
                <td><input type="email" name="user_email" placeholder="Email"></td>
            </tr>
            <tr>
                <td><input type="password" name="user_pass" placeholder="Password"></td>
            </tr>
            <tr>
                <td><input type="password" name="confirm_pass" placeholder="Confirm Password"></td>
            </tr>
            <tr>
                <td>
                    <div class="radio-group" style="margin-top: 10px; margin-bottom: 10px;">
                        <label><input type="radio" name="gender"> Male</label>
                        <label><input type="radio" name="gender"> Female</label>
                    </div>
                </td>
            </tr>
            <tr>
                <td style="border-top: 1px solid black;">
                    <div class="radio-group" style="margin-top: 10px; margin-bottom: 20px;">

                        <label><input type="checkbox" name="sport"> Sport</label>
                        <label><input type="checkbox" name="movie"> Movies</label>
                        <label><input type="checkbox" name="book"> Books</label>
                    </div>
                </td>
            </tr>
            <tr>
                <td>already have an account? <a href="signin.html">Sign In</a></td>
            </tr>
            <tr>
                <td><input id="submit" type="submit" value="Register"></td>
            </tr>
        </table>
    </form>
</body>
</html>
