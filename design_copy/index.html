<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">

        <div style="display: flex; align-items: center; width: 60%; justify-content: flex-start;">
            <div class="logo_container">
                <img src="assets/img/vscode.png" class="logo" alt="" srcset="">
                <h1>Visual Studio Code</h1>
            </div>

            <div class="menu">
            
                <li>Features</li>
                <li>Docs</li>
                <li>Updates</li>
                <li>Blog</li>
                <li>Extenstion</li>
                <li>FAQ</li>
                <li>MCP</li>
                <li>Learn</li>
            
            </div>
        </div>

        <div style="display: flex;  align-items: center; justify-content: space-between;">

        
            <div class="search">
                <div class="serach_icon_label">
                    <img src="assets/img/icons8-search-192 (1).png" class="search_icon" alt="" srcset="">
                    <p>Search</p>
                </div>
                <p class="shortcut">Ctrl+Shift+P</p>
            </div>
            <div class="download">
                <img src="assets/img/icons8-sun-192.png" class="theme_toggle" alt="">
                <input type="button" value="Download">
            </div>
        </div>
    </div>
</body>
</html>
